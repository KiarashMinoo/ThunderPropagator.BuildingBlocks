name: Upgrade Versions

on:
  workflow_dispatch:
    inputs:
      version:
        description: "New version for the project"
        required: true 
        type: string  
        default: "*.*.*.^"

jobs:
  update:
    runs-on: ubuntu-latest
    name: Update version
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Set project versions
        id: upgrade-versions
        uses: vers-one/dotnet-project-version-updater@v1.6
        with:
          file: |
            "BuildingBlocks/**/*.csproj", "BuildingBlocks/**/*.nuspec", "BuildingBlocks/**/AssemblyInfo.cs"
          version: ${{ github.event.inputs.version }}
          
      - run: |
          git status
          git config user.name "Kiarash Minoo"
          git config user.email "yanis_1984@msn.com"
          git add .
          git commit -m "Update project version to ${{ steps.update.outputs.newVersion }}"
          git push
