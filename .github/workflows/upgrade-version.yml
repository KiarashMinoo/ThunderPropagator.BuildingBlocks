name: Upgrade Versions
on:
  workflow_dispatch:
    inputs:
      version:
        description: "New version for the project"
        required: false 
        type: string  

jobs:
  update:
    runs-on: ubuntu-latest
    name: Update version
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Set MyProject.csproj version
        id: update-Application
        uses: vers-one/dotnet-project-version-updater@v1.6
        with:
          file: "BuildingBlocks/RapidStreamer.BuildingBlocks.Application/RapidStreamer.BuildingBlocks.Application.csproj"
          version: ${{ github.event.inputs.version }}

      - name: Set MyProject.csproj version
        id: update-Infrastructure
        uses: vers-one/dotnet-project-version-updater@v1.6
        with:
          file: "BuildingBlocks/RapidStreamer.BuildingBlocks.Infrastructure/RapidStreamer.BuildingBlocks.Infrastructure.csproj"
          version: ${{ github.event.inputs.version }}
          
      - run: |
          git config user.name "Kiarash Minoo"
          git config user.email "yanis_1984@msn.com"
          git add .
          git commit -m "Update project version to ${{ steps.update.outputs.newVersion }}"
          git push
