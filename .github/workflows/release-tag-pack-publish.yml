name: Release tag, Pack & Publish (release/*)

on:
  push:
    branches:
      - release/**
  workflow_dispatch: { }

permissions:
  contents: write
  actions: write

jobs:
  # --- 1) finalize version: strip -beta.*, commit if changed, create & push tag, GH Release ---
  finalize-and-tag:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - name: Ensure Directory.Build.props exists
        run: |
          test -f Directory.Build.props || { echo "Directory.Build.props not found."; exit 1; }

      - name: Strip -beta.* (stable) and read version
        id: ver
        shell: pwsh
        run: |
          $propsPath = Join-Path $PWD "Directory.Build.props"
          [xml]$xml = Get-Content -Raw $propsPath

          function Get-Node($xml, $localName) {
            $ns = $xml.DocumentElement.GetAttribute("xmlns")
            if ($ns) {
              $nsm = New-Object System.Xml.XmlNamespaceManager($xml.NameTable)
              $nsm.AddNamespace("msb", $ns)
              return $xml.SelectSingleNode("//msb:$localName", $nsm)
            } else { return $xml.SelectSingleNode("//$localName") }
          }

          $pkgNode = Get-Node $xml "PackageVersion"
          if (-not $pkgNode) { Write-Error "<PackageVersion> not found."; exit 1 }
          $current = $pkgNode.InnerText.Trim()
          if (-not $current) { Write-Error "<PackageVersion> is empty."; exit 1 }

          # Remove prerelease if any (finalize to stable)
          $stable = $current -replace '-.+$',''
          if ($stable -ne $current) {
            $pkgNode.InnerText = $stable
            $xml.Save($propsPath)
            echo "changed=1" >> $env:GITHUB_OUTPUT
          } else {
            echo "changed=0" >> $env:GITHUB_OUTPUT
          }
          echo "version=$stable" >> $env:GITHUB_OUTPUT
          Write-Host "Stable version: $stable"

      - name: Commit stable version (skip CI)
        if: steps.ver.outputs.changed == '1'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Directory.Build.props
          git commit -m "chore: finalize release version (strip -beta) [skip ci]"
          git push

      - name: Create & push tag
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          TAG="v${VERSION}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists."
          else
            git tag -a "$TAG" -m "Release $TAG"
            git push origin "$TAG"
          fi

      - name: Generate release notes (exclude merges & version bumps)
        id: notes
        shell: bash
        run: |
          set -euo pipefail
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [[ -n "$LAST_TAG" ]]; then
            RAW=$(git log --no-merges --format="%s" "$LAST_TAG..HEAD" || true)
          else
            RAW=$(git log --no-merges -n 100 --format="%s" || true)
          fi
          FILTER='(packageversion|package version|bump version|version bump|^bump[[:space:]])'
          NOTES="$(printf "%s\n" "$RAW" | grep -Ei -v "$FILTER" || true)"
          NOTES="$(printf "%s\n" "$NOTES" | grep -Ei -v 'beta bump.*packageversion' || true)"
          NOTES="$(printf "%s\n" "$NOTES" | sed '/^[[:space:]]*$/d; s/^/- /')"
          [[ -z "$NOTES" ]] && NOTES='- No user-facing changes since last release.'
          printf "%s\n" "$NOTES" > release-notes.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: v${{ steps.ver.outputs.version }}
          body_path: release-notes.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # --- 1b) NEW: propagate finalized version into 'develop' and push ---
  sync-develop-version:
    needs: finalize-and-tag
    runs-on: ubuntu-latest
    steps:
      - name: Checkout develop
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: develop

      - name: Update Directory.Build.props on develop to release version
        shell: pwsh
        env:
          STABLE_VERSION: ${{ needs.finalize-and-tag.outputs.version }}
        run: |
          $propsPath = Join-Path $PWD "Directory.Build.props"
          if (-not (Test-Path $propsPath)) {
            Write-Error "Directory.Build.props not found on develop."
            exit 1
          }

          [xml]$xml = Get-Content -Raw $propsPath

          function Get-Node($xml, $localName) {
            $ns = $xml.DocumentElement.GetAttribute("xmlns")
            if ($ns) {
              $nsm = New-Object System.Xml.XmlNamespaceManager($xml.NameTable)
              $nsm.AddNamespace("msb", $ns)
              return $xml.SelectSingleNode("//msb:$localName", $nsm)
            } else { return $xml.SelectSingleNode("//$localName") }
          }

          $pkgNode = Get-Node $xml "PackageVersion"
          if (-not $pkgNode) { Write-Error "<PackageVersion> not found on develop."; exit 1 }

          $current = $pkgNode.InnerText.Trim()
          $target  = $env:STABLE_VERSION.Trim()

          if ($current -eq $target) {
            Write-Host "Develop already at $target; nothing to change."
            exit 0
          }

          $pkgNode.InnerText = $target
          $xml.Save($propsPath)
          Write-Host "Set develop PackageVersion: $current -> $target"

      - name: Commit & push to develop (skip CI)
        run: |
          if git diff --quiet; then
            echo "No changes to commit on develop."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Directory.Build.props
          git commit -m "chore: sync version from release to develop [skip ci]"
          # Ensure we are up-to-date and push
          git fetch origin develop
          git pull --rebase origin develop
          git push origin HEAD:develop

  # --- 2) pack matrix & upload artifacts (same as before) ---
  pack:
    needs: finalize-and-tag
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest ]
        platform_in: [ AnyCpu, x86, x64, ARM64 ]
        configuration: [ Debug, Release ]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - name: Setup .NET (8.0.x & 9.0.x)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/*.sln', 'Directory.Build.props') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Resolve Platform for .sln
        id: cfg
        shell: bash
        run: |
          IN="${{ matrix.platform_in }}"
          if [[ "$IN" =~ ^[Aa]ny[Cc]pu$ ]]; then PLATFORM_SOL="Any CPU"; else PLATFORM_SOL="$IN"; fi
          echo "platform_sol=$PLATFORM_SOL" >> "$GITHUB_OUTPUT"

      - name: Resolve solution file
        id: sln
        shell: bash
        run: |
          set -euo pipefail
          # Prefer explicit override (Repository Variable or Secret)
          SOL="${SOLUTION_PATH:-}"
          if [[ -n "$SOL" ]]; then
            if [[ ! -f "$SOL" ]]; then
              echo "SOLUTION_PATH is set to '$SOL' but file not found."; exit 1
            fi
          else
            # Autodetect one .sln in repo root (fail if none or many)
            mapfile -t SLNS < <(ls -1 *.sln 2>/dev/null || true)
            if (( ${#SLNS[@]} == 0 )); then
              echo "No .sln file found in repo root. Set SOLUTION_PATH."; exit 1
            elif (( ${#SLNS[@]} > 1 )); then
              echo "Multiple .sln files found: ${SLNS[*]}. Set SOLUTION_PATH to the one you want."; exit 1
            else
              SOL="${SLNS[0]}"
            fi
          fi
          echo "solution=$SOL" >> "$GITHUB_OUTPUT"
          echo "Using solution: $SOL"

      - name: Clean
        run: |
          SLN='${{ steps.sln.outputs.solution }}'
          dotnet clean "$SLN" --nologo 

      - name: Restore
        run: |
          SLN='${{ steps.sln.outputs.solution }}'
          dotnet restore "$SLN" --nologo -p:Platform="${{ steps.cfg.outputs.platform_sol }}"

      - name: Build
        run: |
          SLN='${{ steps.sln.outputs.solution }}'
          dotnet build "$SLN" --nologo \
          -c "${{ matrix.configuration }}" \
          -p:Platform="${{ steps.cfg.outputs.platform_sol }}" \
          -p:ContinuousIntegrationBuild=true \
          --no-restore

      - name: Pack
        run: |
          SLN='${{ steps.sln.outputs.solution }}'
          mkdir -p artifacts/pkg
          dotnet pack "$SLN" --nologo \
            -c "${{ matrix.configuration }}" \
            -p:Platform="${{ steps.cfg.outputs.platform_sol }}" \
            -p:ContinuousIntegrationBuild=true \
            -o artifacts/pkg \
            --no-build

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: packages
          path: artifacts/pkg/*.nupkg
          if-no-files-found: error

      - name: Upload symbols (optional)
        if: ${{ hashFiles('artifacts/pkg/*.snupkg') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: symbols
          path: artifacts/pkg/*.snupkg
          if-no-files-found: ignore

  # --- 3) publish to stable & delete artifacts (same as before) ---
  publish:
    needs: pack
    runs-on: ubuntu-latest
    steps:
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with: { dotnet-version: 8.0.x }

      - name: Download packages
        uses: actions/download-artifact@v4
        with: { name: packages, path: ./dist/packages }

      - name: Download symbols (optional)
        continue-on-error: true
        uses: actions/download-artifact@v4
        with: { name: symbols, path: ./dist/symbols }

      - name: Push .nupkg to stable feed
        env:
          NUGET_SOURCE: ${{ secrets.NUGET_SOURCE }}
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          test -n "$NUGET_SOURCE" && test -n "$NUGET_API_KEY" || { echo "Missing stable feed secrets."; exit 1; }
          shopt -s nullglob
          for pkg in dist/packages/*.nupkg; do
            echo "Pushing $pkg"
            dotnet nuget push "$pkg" --source "$NUGET_SOURCE" --api-key "$NUGET_API_KEY" --skip-duplicate
          done

      - name: Push .snupkg (optional)
        if: ${{ always() }}
        env:
          NUGET_SOURCE: ${{ secrets.NUGET_SOURCE }}
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          shopt -s nullglob
          for sym in dist/symbols/*.snupkg; do
            echo "Pushing $sym"
            dotnet nuget push "$sym" --source "$NUGET_SOURCE" --api-key "$NUGET_API_KEY" --skip-duplicate || true
          done

      - name: Delete 'packages' artifact
        uses: actions/delete-artifact@v4
        with: { name: packages }

      - name: Delete 'symbols' artifact (optional)
        continue-on-error: true
        uses: actions/delete-artifact@v4
        with: { name: symbols }

      - name: Cleanup workspace
        run: rm -rf ./dist ./artifacts || true
