name: PR-Agent AI Code Review

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: pr-agent-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: PR Agent Review
        uses: qodo-ai/pr-agent@main

        env:
          # =====================================================
          # Authentication
          # =====================================================
          OPENAI_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

          # =====================================================
          # OpenRouter Endpoint
          # =====================================================
          OPENAI.API_BASE: https://openrouter.ai/api/v1

          # =====================================================
          # Primary FREE Models
          # Keep strongest free models first
          # =====================================================
          CONFIG.MODEL: openrouter/free

          # =====================================================
          # Fallback FREE Models ONLY
          # =====================================================
          CONFIG.FALLBACK_MODELS: >
            [
              "openrouter/openai/gpt-oss-120b:free",
              "openrouter/nvidia/nemotron-3-super-120b-a12b:free",
              "openrouter/poolside/laguna-m.1:free",
              "openrouter/z-ai/glm-4.5-air:free",
              "openrouter/arcee-ai/trinity-large-thinking:free",
              "openrouter/deepseek/deepseek-v4-flash:free"
            ]

          # =====================================================
          # LiteLLM Reliability
          # =====================================================
          LITELLM.DROP_PARAMS: "true"
          LITELLM.RETRY: "5"
          LITELLM.RETRY_WAIT: "8"
          LITELLM.TIMEOUT: "240"

          # =====================================================
          # General Configuration
          # =====================================================
          CONFIG.RESPONSE_LANGUAGE: en-US
          CONFIG.MAX_DESCRIPTION_TOKENS: "1200"
          CONFIG.CUSTOM_MODEL_MAX_TOKENS: "64000"
          CONFIG.TEMPERATURE: "0.05"

          # =====================================================
          # Smart Cost Protection
          # =====================================================
          CONFIG.MAX_MODEL_TOKENS: "64000"
          CONFIG.MAX_CONTEXT_TOKENS: "120000"

          # =====================================================
          # PR Review Features
          # =====================================================
          PR_REVIEWER.REQUIRE_SCORE_REVIEW: "true"
          PR_REVIEWER.REQUIRE_TESTS_REVIEW: "true"
          PR_REVIEWER.REQUIRE_SECURITY_REVIEW: "true"
          PR_REVIEWER.REQUIRE_ESTIMATE_EFFORT_TO_REVIEW: "true"
          PR_REVIEWER.ENABLE_REVIEW_LABELS_SECURITY: "true"

          # =====================================================
          # Reduce Noise
          # =====================================================
          PR_REVIEWER.INLINE_CODE_COMMENTS: "true"
          PR_REVIEWER.NUM_CODE_SUGGESTIONS: "6"

          # =====================================================
          # Inline Suggestions
          # =====================================================
          PR_CODE_SUGGESTIONS.NUM_CODE_SUGGESTIONS: "6"
          PR_CODE_SUGGESTIONS.COMMITABLE_CODE_SUGGESTIONS: "true"

          # =====================================================
          # PR Description / Summary
          # =====================================================
          PR_DESCRIPTION.PUBLISH_DESCRIPTION_AS_COMMENT: "true"
          PR_DESCRIPTION.USE_DESCRIPTION_MARKERS: "false"

          # =====================================================
          # Enterprise .NET Review Rules
          # =====================================================
          PR_REVIEWER.EXTRA_INSTRUCTIONS: |
            You are reviewing enterprise-grade C#/.NET backend systems.

            Prioritize:
            - correctness
            - security
            - scalability
            - reliability
            - maintainability
            - production readiness

            Focus heavily on:

            Concurrency & Async:
            - async/await correctness
            - cancellation token propagation
            - ConfigureAwait usage
            - hidden Task.Result / Wait deadlocks
            - race conditions
            - thread safety
            - lock contention
            - parallel execution issues

            Performance:
            - memory allocations
            - boxing/unboxing
            - Span<T>/Memory<T> opportunities
            - pooling opportunities
            - excessive LINQ allocations
            - multiple enumeration
            - unnecessary ToList()/ToArray()
            - hot path inefficiencies

            EF Core & Data:
            - N+1 query issues
            - missing AsNoTracking()
            - inefficient Includes
            - query materialization issues
            - transaction consistency
            - retry/idempotency issues
            - connection lifetime problems

            Distributed Systems:
            - Redis usage patterns
            - Kafka/event-streaming issues
            - duplicate message handling
            - eventual consistency concerns
            - outbox/inbox considerations
            - retry storms
            - resiliency gaps

            Architecture:
            - CQRS violations
            - clean architecture boundary leaks
            - DTO/domain leakage
            - dependency injection lifetime mismatches
            - service locator anti-patterns
            - SOLID violations
            - tight coupling

            Reliability & Security:
            - exception handling gaps
            - missing validation
            - nullability issues
            - unsafe deserialization
            - secrets exposure
            - API security concerns
            - authentication/authorization gaps

            Observability:
            - structured logging quality
            - missing correlation IDs
            - poor telemetry practices

            Review behavior:
            - Prefer actionable findings over generic advice
            - Avoid style nitpicks unless maintainability is affected
            - Add precise inline comments with:
              - problematic code
              - root cause
              - production impact
              - concrete fix suggestion
