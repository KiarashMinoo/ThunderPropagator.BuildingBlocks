name: Pack and Push

on:
  push:
    branches:
      - 'main'

permissions:
  contents: write

env:
  ArtifactsDirectory: ${{ github.workspace}}/artifacts
  Version: "*.*.^.*"

jobs:
  project_version:
    runs-on: ubuntu-latest
    name: Update version    
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Set project versions
        id: update
        uses: vers-one/dotnet-project-version-updater@v1.6
        with:
          file: |
            "./BuildingBlocks/**/*.csproj", "./BuildingBlocks/**/*.nuspec", "./BuildingBlocks/**/AssemblyInfo.cs"
          version: ${{ env.Version }}
          
      - run: |
          git config user.name "Kiarash Minoo"
          git config user.email "yanis_1984@msn.com"
          git add .
          git commit -m "Update project version to ${{ steps.project_version.outputs.newVersion }}"
          git push
          
  pack_nugets:
    runs-on: ubuntu-latest
    name: Create nuget
    needs: [project_version]
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
        
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'          

      - run: |
          dotnet restore
          dotnet clean
          dotnet build -c Release
          
          dotnet pack ./BuildingBlocks/RapidStreamer.BuildingBlocks.Infrastructure/RapidStreamer.BuildingBlocks.Infrastructure.csproj --no-build -c Release -o ${{ env.ArtifactsDirectory }}      

      - uses: actions/upload-artifact@v3
        with:
          name: nuget
          if-no-files-found: error
          retention-days: 7
          path: ${{ env.ArtifactsDirectory }}/*.nupkg
             

  push_nuget:    
    runs-on: ubuntu-latest
    name: Deploy to myget    
    needs: [pack_nugets]
    steps:
      - uses: actions/download-artifact@v3
        with:
          name: nuget
          path: ${{ env.ArtifactsDirectory }}
        
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'   
          source-url: https://www.myget.org/F/rapidstreamer/api/v3/index.json
        env:
          NUGET_AUTH_TOKEN: ${{secrets.MYGET_APIKEY}}

      - name: Publish NuGet package
        run: |
            ls ${{ env.ArtifactsDirectory }}      
            dotnet nuget push * ${{ env.ArtifactsDirectory }} --skip-duplicate -k ${{ secrets.MYGET_APIKEY }}

