name: CI

on:
  push:
    branches: [develop, release/**]
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref == 'refs/heads/develop' }}

jobs:
  # NuGet.org Trusted Publishing (OIDC) is built directly into reusable-beta-ci.yml
  # and reusable-release-ci.yml (each has its own inline publish-nuget job) — this
  # repo doesn't need its own publish-nuget job. Set a repo secret named NUGET_USER
  # (Settings > Secrets and variables > Actions > Secrets) with your nuget.org
  # account name.
  beta-ci:
    if: github.ref == 'refs/heads/develop'
    uses: KiarashMinoo/.github/.github/workflows/reusable-beta-ci.yml@main
    with:
      solution-path: 'ThunderPropagator.BuildingBlocks.slnx'
      publish-to-nuget: true
    secrets:
      gh-token: ${{ secrets.GITHUB_TOKEN }}
      nuget-user: ${{ secrets.NUGET_USER }}

  release-ci:
    if: startsWith(github.ref, 'refs/heads/release/')
    uses: KiarashMinoo/.github/.github/workflows/reusable-release-ci.yml@main
    with:
      solution-path: 'ThunderPropagator.BuildingBlocks.slnx'
      publish-to-nuget: true
    secrets:
      gh-token: ${{ secrets.GITHUB_TOKEN }}
      nuget-user: ${{ secrets.NUGET_USER }}
